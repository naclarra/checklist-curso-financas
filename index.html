<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist do curso de finanças</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1d2433;--mute:#6b7487;--line:#e1e5ec;--accent:#2f6fed;--done:#2e9e6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1e222d;--ink:#eceff5;--mute:#98a1b5;--line:#2c3140;--accent:#6c9bff;--done:#4cc38a}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1e222d;--ink:#eceff5;--mute:#98a1b5;--line:#2c3140;--accent:#6c9bff;--done:#4cc38a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.prog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.fill{height:100%;width:0;background:var(--done);transition:width .3s}
.prog p{margin:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.prog .m{color:var(--mute);font-size:.9rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
label{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
input{width:20px;height:20px;margin-top:3px;accent-color:var(--done);flex:none}
.t{flex:1}
.t b{display:block;font-weight:700}
.t span{color:var(--mute);font-size:.9rem}
li.on label{border-color:var(--done)}
li.on .t b{text-decoration:line-through;color:var(--mute)}
.win{display:none;margin-top:16px;text-align:center;font-weight:700}
.win.show{display:block}
button{margin-top:20px;background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit}
</style>
</head>
<body>
<main>
<h1>Módulo 1</h1>
<p class="sub">Curso de finanças · 10 aulas</p>
<div class="prog">
<p><strong id="cnt"></strong><span class="m" id="rest"></span></p>
<div class="bar"><div class="fill" id="fill"></div></div>
</div>
<ul id="list"></ul>
<p class="win" id="win">Módulo 1 completo! 🎉</p>
<button id="reset">Limpar tudo</button>
</main>
<script>
var aulas=[
["Introdução: trabalho enriquece, investimento liberta",32],
["Gestão de gastos: seu plano para vencer!",70],
["Gestão de gastos: quem pensa enriquece",46],
["O poder dos juros compostos: renda passiva x ativa",61],
["Como planejar sua vida financeira com renda passiva",52],
["Como evitar e resolver dívidas",45],
["Inflação e juros: inimigos ou aliados?",29],
["Reserva: fundação dos seus investimentos",33],
["Investindo suas reservas na prática",37],
["Limpe suas lentes: como pensa um assessor financeiro?",33]];
var KEY="financas-m1",state=aulas.map(function(_,i){return i<2});
try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(Array.isArray(p)&&p.length===aulas.length)state=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function fmt(m){var h=Math.floor(m/60),r=m%60;return h?h+"h"+(r?String(r).padStart(2,"0"):""):r+" min"}
var list=document.getElementById("list");
aulas.forEach(function(a,i){
var li=document.createElement("li");
li.innerHTML='<label><input type="checkbox"><div class="t"><b>Aula '+String(i+1).padStart(2,"0")+': '+a[0]+'</b><span>'+a[1]+' min</span></div></label>';
li.querySelector("input").addEventListener("change",function(e){state[i]=e.target.checked;save();render()});
list.appendChild(li)});
function render(){
var n=0,left=0;
Array.prototype.forEach.call(list.children,function(li,i){
li.classList.toggle("on",state[i]);
li.querySelector("input").checked=state[i];
if(state[i])n++;else left+=aulas[i][1]});
document.getElementById("cnt").textContent=n+" de "+aulas.length+" aulas";
document.getElementById("rest").textContent=left?"faltam "+fmt(left):"tudo assistido";
document.getElementById("fill").style.width=(n/aulas.length*100)+"%";
document.getElementById("win").classList.toggle("show",n===aulas.length)}
document.getElementById("reset").addEventListener("click",function(){state=aulas.map(function(){return false});save();render()});
render();
</script>
</body>
</html>
